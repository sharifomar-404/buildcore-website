
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Results Found | BuildCore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="no-results-page">
        <h1>No Results Found</h1>

        <p>
            Sorry, we couldn't find anything matching:
            <strong id="search-query"></strong>
        </p>

        <p>Try another search using different keywords.</p>

        <a href="index.html" class="btn-primary">
            Back to Homepage
        </a>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("search-query").textContent =
            params.get("q") || "";
    </script>

</body>
</html>
